[project]
name = "museum-blind-box-analytics"
version = "0.1.0"
description = "Product analytics and Chinese NLP for museum-themed blind boxes."
requires-python = ">=3.11,<3.14"
dependencies = [
  "duckdb>=1.1,<2",
  "jieba>=0.42,<1",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "snownlp>=0.12,<1",
  "statsmodels>=0.14,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
